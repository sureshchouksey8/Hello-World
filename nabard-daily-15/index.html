<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NABARD Daily 15</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071735;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;padding:24px}.spin{width:44px;height:44px;border:4px solid #ffffff30;border-top-color:#43cf96;border-radius:50%;animation:s .85s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}p{color:#c8d4ea}</style></head><body><div class="box"><div class="spin"></div><p>Loading NABARD Daily 15…</p></div><script>(async()=>{try{const f=['p1.txt','p2.txt','p3.txt','r1.txt','r2.txt','r3.txt','r4.txt','r5.txt'],v=Date.now(),b=(await Promise.all(f.map(x=>fetch(x+'?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(x);return r.text()})))).join('').replace(/\s/g,''),u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip')),h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>Portal update could not load</h2><p>Please refresh once. If it still does not open, use Chrome or Edge.</p></div>'}})();</script></body></html>
